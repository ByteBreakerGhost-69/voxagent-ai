services:
  postgres:
    image: postgres:17
    container_name: voxagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voxagent
      POSTGRES_PASSWORD: voxagent_dev_password
      POSTGRES_DB: voxagent
    ports:
      - "5432:5432"
    volumes:
      - voxagent_pgdata:/var/lib/postgresql/data

volumes:
  voxagent_pgdata:
