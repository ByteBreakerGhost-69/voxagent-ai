<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>VoxAgent AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      display: flex;
      justify-content: center;
    }

    .container {
      width: min(900px, 92%);
      padding: 40px 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 42px;
    }

    .status {
      color: #9ca3af;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .session {
      color: #6b7280;
      font-size: 13px;
      word-break: break-all;
      margin-bottom: 24px;
    }

    .chat {
      background: #1f2937;
      border-radius: 18px;
      padding: 20px;
      min-height: 450px;
      max-height: 600px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .message {
      margin: 12px 0;
      padding: 14px 18px;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .user {
      background: #374151;
    }

    .assistant {
      background: #2563eb;
    }

    .interim {
      opacity: 0.65;
      font-style: italic;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 22px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    #talkBtn {
      background: #16a34a;
      color: white;
    }

    #stopBtn {
      background: #dc2626;
      color: white;
    }

    #clearBtn {
      background: #4b5563;
      color: white;
    }

    #newSessionBtn {
      background: #7c3aed;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>🎙️ VoxAgent AI</h1>

    <div class="status" id="status">
      Initializing...
    </div>

    <div class="session" id="sessionInfo">
      Session: creating...
    </div>

    <div class="chat" id="chat"></div>

    <div class="controls">
      <button id="talkBtn">🎤 Talk</button>
      <button id="stopBtn" disabled>⏹ Stop</button>
      <button id="clearBtn">🗑 Clear</button>
      <button id="newSessionBtn">🔄 New Session</button>
    </div>

  </div>

  <script>
    const chat = document.getElementById("chat");
    const status = document.getElementById("status");
    const sessionInfo = document.getElementById("sessionInfo");

    const talkBtn = document.getElementById("talkBtn");
    const stopBtn = document.getElementById("stopBtn");
    const clearBtn = document.getElementById("clearBtn");
    const newSessionBtn = document.getElementById("newSessionBtn");

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition = null;
    let conversationId = null;

    // Full user turn accumulated from recognition.
    let transcriptBuffer = "";

    // Last interim transcript shown in UI.
    let interimText = "";

    // Timer used to detect that the user has stopped speaking.
    let silenceTimer = null;

    // Do not process the same turn twice.
    let turnProcessing = false;

    // ~1.2 seconds of silence = end of turn.
    const SILENCE_DELAY = 1200;

    function addMessage(role, text, extraClass = "") {
      const div = document.createElement("div");

      div.className = `message ${role} ${extraClass}`.trim();
      div.textContent =
        `${role === "user" ? "You" : "VoxAgent"}: ${text}`;

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;

      return div;
    }

    function stopSpeaking() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }

      if (status.textContent === "🔊 VoxAgent is speaking...") {
        status.textContent = "Ready";
      }
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        console.warn("Speech synthesis is not supported.");
        return;
      }

      stopSpeaking();

      const utterance = new SpeechSynthesisUtterance(text);

      utterance.lang = "id-ID";
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;

      utterance.onstart = () => {
        status.textContent = "🔊 VoxAgent is speaking...";
      };

      utterance.onend = () => {
        status.textContent = "Ready";
      };

      utterance.onerror = (event) => {
        console.error("Speech synthesis error:", event);
        status.textContent = "⚠️ Voice output failed";
      };

      window.speechSynthesis.speak(utterance);
    }

    async function createSession() {
      status.textContent = "Creating VoxAgent session...";

      try {
        const response = await fetch("/api/agent/session", {
          method: "POST"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.conversationId) {
          throw new Error("No conversationId returned");
        }

        conversationId = data.conversationId;

        sessionInfo.textContent =
          `Session: ${conversationId}`;

        status.textContent = "Ready";

        console.log("VoxAgent session:", conversationId);

      } catch (error) {
        console.error("Failed to create session:", error);

        status.textContent =
          "❌ Failed to initialize VoxAgent";

        sessionInfo.textContent =
          "Session: unavailable";
      }
    }

    async function askAgent(message) {
      if (!conversationId) {
        await createSession();
      }

      if (!conversationId) {
        throw new Error("No active conversation session");
      }

      status.textContent = "🧠 VoxAgent is thinking...";

      try {
        const response = await fetch("/api/agent/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message,
            conversationId
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.response) {
          throw new Error("Agent returned no response");
        }

        addMessage("assistant", data.response);
        speak(data.response);

      } catch (error) {
        console.error("Agent request failed:", error);

        status.textContent =
          "❌ Failed to contact VoxAgent";
      }
    }

    function clearSilenceTimer() {
      if (silenceTimer) {
        clearTimeout(silenceTimer);
        silenceTimer = null;
      }
    }

    function scheduleEndOfTurn() {
      clearSilenceTimer();

      silenceTimer = setTimeout(() => {
        finishUserTurn();
      }, SILENCE_DELAY);
    }

    async function finishUserTurn() {
      clearSilenceTimer();

      if (turnProcessing) {
        return;
      }

      const finalText = transcriptBuffer.trim();

      if (!finalText) {
        return;
      }

      turnProcessing = true;

      // Stop recognition after the turn has been assembled.
      if (recognition) {
        try {
          recognition.stop();
        } catch (error) {
          console.warn("Recognition stop:", error);
        }
      }

      // Remove any interim-only UI.
      removeInterimMessage();

      // Show exactly one final user message.
      addMessage("user", finalText);

      // Reset buffer before sending.
      transcriptBuffer = "";
      interimText = "";

      await askAgent(finalText);

      turnProcessing = false;
    }

    let interimElement = null;

    function showInterim(text) {
      if (!text) {
        removeInterimMessage();
        return;
      }

      if (!interimElement) {
        interimElement = addMessage(
          "user",
          text,
          "interim"
        );
      } else {
        interimElement.textContent = `You: ${text}`;
      }
    }

    function removeInterimMessage() {
      if (interimElement) {
        interimElement.remove();
        interimElement = null;
      }
    }

    function setupRecognition() {
      if (!SpeechRecognition) {
        status.textContent =
          "❌ Speech recognition is not supported by this browser.";

        talkBtn.disabled = true;
        return;
      }

      recognition = new SpeechRecognition();

      recognition.lang = "id-ID";

      // Keep recognizing multiple chunks.
      recognition.continuous = true;

      // Receive interim speech while user is still talking.
      recognition.interimResults = true;

      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        status.textContent = "🎤 Listening...";

        talkBtn.disabled = true;
        stopBtn.disabled = false;

        turnProcessing = false;
        transcriptBuffer = "";
        interimText = "";

        removeInterimMessage();
      };

      recognition.onresult = (event) => {
        let newFinalText = "";
        let newInterimText = "";

        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {
          const result = event.results[i];

          const text =
            result[0].transcript.trim();

          if (result.isFinal) {
            newFinalText += text + " ";
          } else {
            newInterimText += text + " ";
          }
        }

        if (newFinalText) {
          transcriptBuffer += newFinalText;
        }

        interimText = newInterimText.trim();

        const preview =
          `${transcriptBuffer} ${interimText}`.trim();

        if (preview) {
          showInterim(preview);
        }

        // Every recognized chunk resets the silence timer.
        // This is what allows the user to speak for longer.
        scheduleEndOfTurn();
      };

      recognition.onerror = (event) => {
        console.error(
          "Speech recognition error:",
          event.error
        );

        if (event.error === "no-speech") {
          status.textContent =
            "🎤 Waiting for speech...";
          return;
        }

        status.textContent =
          `❌ Voice error: ${event.error}`;
      };

      recognition.onend = () => {
        talkBtn.disabled = false;
        stopBtn.disabled = true;

        // Chrome can stop recognition even with continuous=true.
        // If there is still an unfinished turn, give it a moment.
        if (
          transcriptBuffer.trim() &&
          !turnProcessing
        ) {
          scheduleEndOfTurn();
        } else if (!turnProcessing) {
          status.textContent = "Ready";
        }
      };
    }

    talkBtn.addEventListener("click", () => {
      if (!recognition) {
        return;
      }

      // Barge-in: interrupt AI speech immediately.
      stopSpeaking();

      // Start a fresh user turn.
      transcriptBuffer = "";
      interimText = "";
      turnProcessing = false;

      removeInterimMessage();
      clearSilenceTimer();

      try {
        recognition.start();
      } catch (error) {
        console.error(
          "Recognition start failed:",
          error
        );
      }
    });

    stopBtn.addEventListener("click", () => {
      if (recognition) {
        try {
          recognition.stop();
        } catch (error) {
          console.warn("Recognition stop:", error);
        }
      }

      // Treat explicit Stop as end of turn.
      finishUserTurn();
    });

    clearBtn.addEventListener("click", () => {
      chat.innerHTML = "";

      stopSpeaking();
      clearSilenceTimer();

      transcriptBuffer = "";
      interimText = "";
      turnProcessing = false;

      interimElement = null;

      status.textContent = "Ready";
    });

    newSessionBtn.addEventListener("click", async () => {
      chat.innerHTML = "";

      stopSpeaking();
      clearSilenceTimer();

      transcriptBuffer = "";
      interimText = "";
      turnProcessing = false;

      interimElement = null;

      await createSession();
    });

    createSession();
    setupRecognition();
  </script>
</body>
</html>
